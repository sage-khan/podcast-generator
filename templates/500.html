{% extends 'base.html' %}

{% block content %}
<div class="container text-center py-5">
    <i class="fas fa-exclamation-triangle fa-4x mb-4 text-warning"></i>
    <h1 class="display-4 mb-4">500</h1>
    <h2 class="h3 mb-4">Server Error</h2>
    <p class="lead mb-5">Something went wrong on our end. Please try again later.</p>
    <div class="d-flex justify-content-center gap-3">
        <a href="{% url 'admin:index' %}" class="btn btn-primary">
            <i class="fas fa-home me-2"></i>Return to Home
        </a>
        <button onclick="window.location.reload()" class="btn btn-outline-secondary">
            <i class="fas fa-sync-alt me-2"></i>Refresh Page
        </button>
    </div>
</div>
{% endblock %}
