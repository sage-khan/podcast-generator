apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: podcast-generator
data:
  default.conf: |
    # MIME types configuration
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        application/javascript                js;
        application/json                      json;
        application/xml                       rss atom;
        image/png                             png;
        image/svg+xml                         svg svgz;
        image/webp                            webp;
        image/x-icon                          ico;
        font/woff                             woff;
        font/woff2                            woff2;
        application/vnd.ms-fontobject         eot;
        font/ttf                              ttf;
        font/collection                       ttc;
        font/otf                              otf;
    }

    server {
        listen 80;
        server_name k8s.example.com;
        
        # Don't redirect ACME challenge requests and return 200 OK
        # NOTE: the key-authorization suffix below is per-challenge and issued by
        # your ACME client (certbot/cert-manager) at renewal time — replace it
        # with the value your tooling gives you, this is only a placeholder.
        location ~ /.well-known/acme-challenge/(.*) {
            default_type text/plain;
            return 200 "$1.REPLACE_WITH_ACME_ACCOUNT_KEY_THUMBPRINT";
        }
        
        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
        
    server {
        listen 443 ssl;
        server_name k8s.example.com;
        
        ssl_certificate /etc/nginx/ssl/tls.crt;
        ssl_certificate_key /etc/nginx/ssl/tls.key;
        
        # Improved static file handling
        location /static/ {
            alias /var/www/static/;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000";
            gzip on;
            gzip_types text/css application/javascript application/json image/svg+xml;
            gzip_min_length 1000;
            
            # Debug static file serving (temporary, remove in production)
            add_header X-Debug-Path $document_root$uri;
            add_header X-Debug-File $request_filename;
            add_header X-Static-Root "/var/www/static/";
        }
        
        location /media/ {
            alias /var/www/media/;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000";
        }
        
        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
