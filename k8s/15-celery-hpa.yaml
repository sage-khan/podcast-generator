# /path/to/podcast-generator/k8s/15-celery-hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-hpa
  namespace: podcast-generator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery  # References your celery deployment
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
