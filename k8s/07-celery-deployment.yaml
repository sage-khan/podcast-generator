apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery
  namespace: podcast-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery
  template:
    metadata:
      labels:
        app: celery
    spec:
      containers:
      - name: celery
        image: registry.digitalocean.com/app-registry-colab/ai-image-gen:latest
        imagePullPolicy: Always
        command: ["celery", "-A", "config.celery", "worker", "--loglevel=info"]
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        volumeMounts:
        - name: postgres-ca-cert
          mountPath: /etc/ssl/certs/postgres-ca.crt
          subPath: ca.crt
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "200m"
      volumes:
      - name: postgres-ca-cert
        secret:
          secretName: postgres-ca
