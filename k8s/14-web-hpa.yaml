# /path/to/podcast-generator/k8s/14-web-hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-hpa
  namespace: podcast-generator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web  # References your web deployment
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
