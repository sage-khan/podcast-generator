# HTTP server - redirects to HTTPS
server {
    listen 80;
    server_name example.com;
    server_tokens off;

    # Don't redirect ACME challenge requests
    location ~ /.well-known/acme-challenge/(.*) {
        default_type text/plain;
        return 200 "$1.vjWQ5Y7UWbDYZ07cpG16c3wMdAL429tPyPB19lLgxfw";
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server configuration
server {
    listen 443 ssl;
    server_name example.com;
    server_tokens off;

    # SSL certificate paths
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # MIME types configuration
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Additional MIME types that might be missing from default config
    types {
        text/css                              css;
        application/javascript                js;
        application/json                      json;
        image/svg+xml                         svg svgz;
        font/woff                             woff;
        font/woff2                            woff2;
        application/vnd.ms-fontobject         eot;
        font/ttf                              ttf;
        font/otf                              otf;
    }

    # Recommended SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Improved static file handling
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1000;

        # Debug static file serving (temporary, remove in production)
        add_header X-Debug-Path $document_root$uri;
        add_header X-Debug-File $request_filename;
        add_header X-Static-Root "/var/www/static/";
    }

    # Media files - path matches docker-compose.yml volume mount
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Root location
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeout settings
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
